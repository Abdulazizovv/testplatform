# This nginx does NOT terminate TLS and does NOT know the public domain. The host's own
# nginx (outside this repo, managing its own certificates) reverse-proxies the real
# domain to 127.0.0.1:${NGINX_PORT} (see docker-compose.yml and docs/DEPLOYMENT.md).
# This container only routes inside the compose network, on ONE origin:
#   /api, /admin, /static, /media, /healthz/ -> backend; everything else -> frontend.

# --- real client IP ---------------------------------------------------------
# Traffic arrives from the host nginx through Docker's bridge, so $remote_addr would
# be the bridge gateway for every visitor and limit_req would throttle ALL users as
# one. Trust X-Forwarded-For only from private ranges (host nginx / docker gateway)
# and recover the real client address from it.
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# X-Forwarded-Proto is trusted from the host nginx and passed through unchanged (never
# overwritten with $scheme, which is always "http" here) so Django's
# SECURE_PROXY_SSL_HEADER keeps working. Without a proxy in front (local testing) it
# falls back to $scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
# Anonymous student API (/api/v1/public/): generous per-IP (a classroom may share one NAT
# address; every answer is an autosave) but capped; attempt creation is much stricter.
limit_req_zone $binary_remote_addr zone=public_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=attempt_start_limit:10m rate=10r/m;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# JSON access log - greppable/parseable if this VPS ever gets log shipping.
log_format json_combined escape=json
  '{'
    '"ts":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"request":"$request",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time",'
    '"http_referer":"$http_referer",'
    '"http_user_agent":"$http_user_agent"'
  '}';

server {
    listen 80;
    server_tokens off;

    access_log /var/log/nginx/access.log json_combined;

    client_max_body_size 10m;
    limit_conn conn_limit 50;

    add_header X-Content-Type-Options nosniff always;

    # Proxy headers shared by all proxied locations. X-Forwarded-For / X-Real-IP are
    # OVERWRITTEN with the real client IP (not appended) so the backend can trust them:
    # a client cannot spoof its address to dodge rate limits or login lockouts.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    location /static/ {
        alias /srv/static/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /srv/media/;
        expires 30d;
        access_log off;
    }

    # Strictest limit first: exact match beats the /api/ prefix.
    location = /api/v1/auth/login/ {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://backend;
    }

    # Regex locations beat prefix locations, so this exact shape wins over /api/v1/public/.
    location ~ ^/api/v1/public/tests/[0-9a-fA-F-]+/attempts/$ {
        limit_req zone=attempt_start_limit burst=15 nodelay;
        proxy_pass http://backend;
    }

    location /api/v1/public/ {
        limit_req zone=public_limit burst=60 nodelay;
        proxy_pass http://backend;
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend;
    }

    location /admin/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend;
    }

    # Liveness probes: /healthz/ (trailing slash) = backend, /healthz = frontend.
    location = /healthz {
        proxy_pass http://frontend;
        access_log off;
    }

    location /healthz/ {
        proxy_pass http://backend;
        access_log off;
    }

    location / {
        proxy_pass http://frontend;
    }
}
