# Production host nginx configuration (outside Docker, manages TLS via Certbot).
# This file runs on the VPS itself, NOT in the Docker container.
# The container's nginx listens on 127.0.0.1:7788 (see docker-compose.yml).
# This config reverse-proxies the real domain to that loopback port.
#
# Installation: copy this file to /etc/nginx/sites-available/<domain>, then:
#   ln -s /etc/nginx/sites-available/<domain> /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# TLS certificates: use Certbot to manage them:
#   sudo certbot certonly --nginx -d <domain> -d www.<domain>
#   sudo certbot renew --dry-run   # test auto-renewal

server {
    listen 80;
    server_name <DOMAIN> www.<DOMAIN>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name <DOMAIN> www.<DOMAIN>;

    # Certbot manages these paths; let it update them automatically.
    ssl_certificate /etc/letsencrypt/live/<DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<DOMAIN>/privkey.pem;

    # Modern TLS configuration (A+ rating on SSL Labs).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Allow large file uploads (images, documents, etc.).
    client_max_body_size 10m;

    # GZip compression.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Access log (optional; comment out if you don't need it).
    access_log /var/log/nginx/<DOMAIN>_access.log combined buffer=16k flush=5s;
    error_log /var/log/nginx/<DOMAIN>_error.log warn;

    # Proxy to the Docker container's nginx (loopback only).
    location / {
        proxy_pass http://127.0.0.1:7788;

        # Essential headers for Django to trust TLS and client IP.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;

        # Timeouts.
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Optional: restrict /admin/ to known IPs to reduce brute-force attack surface.
    # Uncomment and adjust as needed:
    # location /admin/ {
    #     allow 192.168.1.0/24;   # office
    #     allow 10.0.0.0/8;       # VPN
    #     deny all;
    #     proxy_pass http://127.0.0.1:7788;
    #     # ... proxy headers as above
    # }
}
