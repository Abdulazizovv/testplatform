services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment: &backend-env
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    logging: *default-logging
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - public
      - internal

  # Celery worker (celery-beat is added later, when the first periodic job exists).
  # Talks only to postgres/redis, so it sits on the internal network alone - no
  # outbound internet access until a task actually needs it (e.g. the Telegram bot).
  celery:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment: *backend-env
    logging: *default-logging
    entrypoint: []
    command: celery -A config worker -l INFO --concurrency=2
    # Overrides the image's inherited HTTP healthcheck (this container serves no HTTP).
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      # Runtime-only: server-side fetches (auth check on protected pages) reach the
      # backend directly over the compose network instead of looping out through nginx.
      # The browser always uses same-origin relative URLs (/api/...), so there are no
      # public-URL build args and no domain baked into the image.
      API_INTERNAL_URL: http://backend:8000
    logging: *default-logging
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - public

  # Not internet-facing: bound to loopback only. The host's own nginx (outside this
  # repo, holding the TLS certs) reverse-proxies the real domain to this port.
  # See nginx/default.conf and docs/DEPLOYMENT.md.
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:${NGINX_PORT:-7788}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/srv/static:ro
      - media_volume:/srv/media:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - public

networks:
  public:
  internal:
    internal: true

volumes:
  postgres_data:
  static_volume:
  media_volume:
